[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "agent-core"
version = "0.14.2"
description = "Core runtime for agent"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0.2,<7",
    "numpy==2.5.4",
    "python-docx==1.2.0",
    "pypdfium2==5.15.0",
    "sqlite-vec==0.1.9",
    "onnx==1.19.1"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0"
]


[project.scripts]
agent-core = "agent.main:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
